services:
  - type: web
    name: casegraph-demo-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_DATABASE_URL
        fromDatabase:
          name: casegraph-demo-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://casegraph-demo.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.8
  - type: web
    runtime: static
    name: casegraph-demo
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    rootDir: frontend
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: casegraph-demo-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: casegraph-demo-db
    plan: free
    region: singapore
    databaseName: casegraph_demo
    user: casegraph_demo
